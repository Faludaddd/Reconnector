name: Reconnector
options:
  bundleIdPrefix: com.reconnector
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Reconnector:
    type: application
    platform: iOS
    sources:
      - path: Reconnector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reconnector.app
        INFOPLIST_GENERATION_CLASS: Reconnector
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification fetch"
        INFOPLIST_KEY_CFBundleDisplayName: "Reconnector"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    preBuildScripts:
      - name: Stamp Unique Display Name
        # Injects version + build + timestamp into Info.plist so every IPA
        # has a unique home-screen name. Prevents iOS "(1)" duplicates
        # when sideloading multiple builds.
        script: |
          set -e
          PLIST="${BUILT_PRODUCTS_DIR}/${INFOPLIST_PATH}"
          if [ ! -f "$PLIST" ]; then
            echo "[stamp-name] Info.plist not yet generated, skipping."
            exit 0
          fi
          VERSION="$MARKETING_VERSION"
          BUILD="$CURRENT_PROJECT_VERSION"
          STAMP=$(date +%y%m%d-%H%M)
          DISPLAY="Reconnector ${VERSION} (${BUILD}) ${STAMP}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${DISPLAY}" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${DISPLAY}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${DISPLAY}" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string ${DISPLAY}" "$PLIST"
          echo "[stamp-name] Display name set to: ${DISPLAY}"
