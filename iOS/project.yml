name: Reconnector
options:
  bundleIdPrefix: com.reconnector
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Reconnector:
    type: application
    platform: iOS
    sources:
      - path: Reconnector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reconnector.app
        INFOPLIST_GENERATION_CLASS: Reconnector
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "11"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification fetch"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    postBuildScripts:
      - name: Stamp Unique Display Name
        # Runs AFTER Info.plist is copied into the .app bundle.
        # Injects version + build + timestamp so every IPA has a unique
        # home-screen name — prevents iOS "(1)" duplicates when sideloading.
        script: |
          APP_PATH="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app"
          PLIST="${APP_PATH}/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "[stamp-name] ERROR: Info.plist not found at $PLIST"
            exit 1
          fi
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          STAMP=$(date +%y%m%d-%H%M)
          DISPLAY="Reconnector ${VERSION} (${BUILD}) ${STAMP}"
          # Delete-then-Add is the safe upsert pattern for PlistBuddy
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${DISPLAY}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleName" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string ${DISPLAY}" "$PLIST"
          echo "[stamp-name] Display name set to: ${DISPLAY}"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST"
